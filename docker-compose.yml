services:
  douyin-cloud-streak:
    build:
      context: .
      args:
        USE_CN_MIRROR: "1"
    container_name: douyin-cloud-streak
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - AUTH_TOKEN=spark_secret_token_change_me
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    shm_size: "256mb"
